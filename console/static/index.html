<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gatekeepers and guardrails: demo console</title>
<style nonce="__NONCE__">
  /* Dark theme; every text and chip pair below is at least 7:1 (tests/test_console_live.py checks the declared pairs). */
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --text: #f0f3f6; --muted: #c9d1d9; --line: #3d444d; --accent: #79c0ff;
    --ok: #56d364; --deny: #ff7b72; --redact: #e3b341; --supp: #ffa657; --throt: #d2a8ff; --consent: #79c0ff; --other: #b1bac4;
    --chiptext: #0b0f14; --on: #56d364; --off: #e3b341; --denytext: #ffa198; --todo: #a3acb7;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
  body { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; height: 100vh; overflow: hidden; }
  .hidden { display: none !important; }
  #status { display: flex; flex-wrap: wrap; column-gap: 26px; row-gap: 4px; align-items: center; padding: 10px 22px; background: var(--panel); border-bottom: 2px solid var(--line); font-size: 24px; white-space: nowrap; overflow: hidden; }
  #status .k { color: var(--muted); margin-right: 8px; }
  #status .v { font-weight: 700; }
  #status .v.on { color: var(--on); }
  #status .v.off { color: var(--off); }
  #status .sp { flex: 1; }
  #status .at { color: var(--muted); font-size: 24px; }
  /* A control whose value just changed (a step script ran): orange outline and a CHANGED tag, dark text on orange. The tag
     sits on the item's top-right corner, in the strip's top padding (or the row gap), so a mark never moves the layout. */
  #status { padding-top: 14px; padding-bottom: 6px; row-gap: 12px; }
  #status .it { position: relative; }
  #status .it.chg { outline: 3px solid var(--supp); outline-offset: 3px; border-radius: 6px; }
  #status .tag { position: absolute; top: -13px; right: -18px; padding: 0 5px; border-radius: 4px; background: var(--supp); color: var(--chiptext); font-size: 14px; line-height: 16px; font-weight: 800; letter-spacing: 0.06em; }
  /* Moment tracker: done stages green with a check mark, the current one dark text on orange, the rest grey (on --bg).
     At 1920 px every name and the longest step-script banner fit on one line, even at stage 6 with seven check marks;
     narrower than 1880 px, only the current stage keeps its name. */
  #moments { display: flex; align-items: center; gap: 6px; padding: 2px 16px; background: var(--bg); border-bottom: 2px solid var(--line); font-size: 18px; line-height: 1.2; white-space: nowrap; overflow: hidden; min-width: 0; }
  #moments .lbl { color: var(--muted); font-weight: 700; letter-spacing: 0.08em; margin-right: 4px; flex: none; }
  #moments .pills { display: flex; gap: 6px; flex: none; }
  #moments button.mp { font-size: 18px; line-height: 1.2; padding: 0 8px; border-radius: 999px; border: 2px solid var(--line); background: transparent; color: var(--todo); font-weight: 600; cursor: pointer; }
  #moments button.mp.done { color: var(--ok); }
  #moments button.mp.cur { background: var(--supp); border-color: var(--supp); color: var(--chiptext); font-weight: 800; }
  #moments button.mp .ck { display: none; margin-right: 3px; }
  #moments button.mp.done .ck { display: inline; }
  @media (max-width: 1879px) { #moments button.mp:not(.cur) .nm { display: none; } }
  #moments .banner { margin-left: auto; padding-left: 10px; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
  #moments .banner.running { color: var(--accent); } #moments .banner.done { color: var(--ok); } #moments .banner.failed { color: var(--denytext); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; min-height: 0; }
  .pane { display: flex; flex-direction: column; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; min-height: 0; }
  .pane h2 { margin: 0; padding: 8px 16px; font-size: 28px; border-bottom: 2px solid var(--line); display: flex; gap: 14px; align-items: baseline; }
  .pane h2 .role { color: var(--muted); font-weight: 400; }
  .pane h2 .busy { margin-left: auto; font-size: 24px; color: var(--accent); }
  .chat { flex: 1; overflow-y: auto; padding: 10px 16px; font-size: 26px; line-height: 1.35; min-height: 0; }
  .turn { border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 10px; }
  .msg { white-space: pre-wrap; margin: 4px 0; }
  .msg.user { color: var(--accent); font-weight: 600; }
  .msg.user::before { content: "Staff: "; color: var(--muted); font-weight: 400; }
  .msg.agent:empty::before { content: "..."; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
  .chip { font-size: 24px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 2px 4px 2px 10px; }
  .chip .tool { color: var(--muted); }
  .note { font-size: 24px; color: var(--redact); }
  .dec { display: inline-block; padding: 1px 10px; border-radius: 6px; font-weight: 800; color: var(--chiptext); letter-spacing: 0.02em; }
  .dec.ok { background: var(--ok); } .dec.deny { background: var(--deny); } .dec.redact { background: var(--redact); }
  .dec.supp { background: var(--supp); } .dec.throt { background: var(--throt); } .dec.consent { background: var(--consent); } .dec.other { background: var(--other); }
  .actions { display: flex; gap: 10px; padding: 8px 16px 0; align-items: center; flex-wrap: wrap; }
  select, button, .btn { font-size: 24px; font-family: inherit; }
  select { background: var(--panel2); color: var(--text); border: 2px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 360px; }
  button, .btn { background: var(--panel2); color: var(--text); border: 2px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; text-decoration: none; }
  button:disabled { color: var(--muted); border-style: dashed; cursor: default; }
  button.primary, .btn.primary { background: var(--accent); color: var(--chiptext); border-color: var(--accent); font-weight: 700; }
  form.ask { padding: 8px 16px 12px; }
  textarea { width: 100%; box-sizing: border-box; height: 78px; resize: none; background: var(--panel2); color: var(--text); border: 2px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 26px; font-family: inherit; }
  .card { flex: 1; padding: 24px 28px; font-size: 26px; }
  .card .title { font-size: 30px; font-weight: 700; margin-bottom: 18px; }
  .card .kv { display: grid; grid-template-columns: 260px 1fr; padding: 6px 0; }
  .card .kv span { color: var(--muted); }
  .card .row { display: flex; gap: 14px; margin-top: 26px; }
  .card .msgline { margin-top: 18px; color: var(--redact); min-height: 34px; }
  .flash { color: var(--denytext); font-size: 24px; padding: 0 16px; min-height: 0; }
  #feed { background: var(--panel); border-top: 2px solid var(--line); padding: 6px 18px 10px; }
  #feed table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 24px; }
  #feed th { text-align: left; color: var(--muted); font-weight: 400; padding: 2px 10px; }
  #feed td { padding: 4px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-top: 1px solid var(--line); height: 34px; }
  #feed td.d { overflow: visible; }
  /* Reason wraps onto as many lines as it needs; the row grows, the other cells stay top-aligned. */
  #feed td { vertical-align: top; }
  #feed td.r { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; line-height: 1.25; }
  #feed col.w-t { width: 7%; } #feed col.w-p { width: 6%; } #feed col.w-tool { width: 15%; } #feed col.w-d { width: 13%; } #feed col.w-c { width: 24%; }
  /* ---- Step card and Run buttons. ---- */
  :root { --str: #a5d6ff; --keybg: #2f2620; }  /* --keybg: --supp at 14% over --bg, as a solid color for the 7:1 check */
  /* Run buttons for the current moment's steps, at the right end of the tracker row. With buttons in the row the script
     banner is hidden and finished moments shrink to a check mark and their number. */
  #moments .runs { margin-left: auto; display: flex; gap: 6px; flex: none; }
  #moments .runs:empty { display: none; }
  #moments.has-runs .banner { display: none !important; }
  #moments.has-runs button.mp.done .nm { display: none; }
  /* Only when the row would still not fit (Moment 2: three steps and Fallbacks): the moments still to come show their number only. */
  #moments.tight button.mp:not(.cur) .nm { display: none; }
  #moments button.run { font-size: 18px; line-height: 1.2; padding: 0 10px; border-radius: 6px; border: 2px solid var(--accent); background: transparent; color: var(--accent); font-weight: 700; cursor: pointer; }
  #moments button.run.todo { border-color: var(--line); color: var(--todo); font-weight: 600; }
  #moments button.run.running { background: var(--accent); color: var(--chiptext); border-style: solid; }
  #moments button.run.done { border-color: var(--line); color: var(--ok); }
  #moments button.run.failed { border-color: var(--line); color: var(--denytext); }
  #moments button.run:disabled:not(.running) { border-style: dashed; cursor: default; }
  #fallbacks { position: fixed; z-index: 10; display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--panel2); border: 2px solid var(--line); border-radius: 8px; }
  #fallbacks button { font-size: 18px; padding: 2px 12px; text-align: left; }
  /* Step card: takes the feed's place while it is open. */
  #feed.card-open table { display: none; }
  #stepcard { padding: 2px 2px 0; }
  #stepcard .hd { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; min-width: 0; }
  #stepcard .kind { flex: none; padding: 2px 10px; border-radius: 6px; font-size: min(16px, 0.85vw); font-weight: 800; letter-spacing: 0.08em; color: var(--chiptext); }
  #stepcard .kind.api { background: var(--accent); } #stepcard .kind.switch { background: var(--redact); } #stepcard .kind.stand { background: var(--throt); }
  #stepcard .title { flex: none; font-size: min(26px, 1.36vw); font-weight: 800; white-space: nowrap; }
  #stepcard .desc { font-size: min(20px, 1.05vw); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #stepcard .state { margin-left: auto; flex: none; font-size: min(22px, 1.15vw); font-weight: 800; }
  #stepcard .state.running { color: var(--accent); } #stepcard .state.done { color: var(--ok); }
  #stepcard .state.failed, #stepcard .state.stopped { color: var(--denytext); }
  #stepcard button.x { flex: none; font-size: 18px; padding: 2px 12px; }
  #stepcard .body { display: grid; grid-template-columns: 62fr 38fr; gap: 12px; min-height: calc(7 * 1.35 * min(26px, 1.36vw)); }
  #stepcard.wide .body { grid-template-columns: 42fr 58fr; }
  #stepcard .code, #stepcard .out { background: var(--bg); border: 2px solid var(--line); border-radius: 8px; padding: 4px 0 8px; min-width: 0; overflow: hidden;
                                    font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; line-height: 1.35;
                                    font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
  #stepcard .code { font-size: min(26px, 1.36vw); }
  /* The output pane takes the code pane's height and scrolls inside it (newest line at the bottom). */
  #stepcard .out { position: relative; font-size: min(24px, 1.25vw); }
  #stepcard .out .scroll { position: absolute; inset: 4px 0 8px; overflow-y: auto; scrollbar-width: none; }
  #stepcard .src { font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: min(16px, 0.85vw); color: var(--muted); padding: 4px 14px 2px; letter-spacing: 0.04em; }
  #stepcard .ln { white-space: pre; padding: 0 14px 0 10px; border-left: 4px solid transparent; }
  #stepcard .ln.key { background: var(--keybg); border-left-color: var(--supp); }
  #stepcard .gap { height: 6px; }
  #stepcard .kw { color: var(--denytext); } #stepcard .str { color: var(--str); } #stepcard .num { color: var(--accent); } #stepcard .com { color: var(--muted); }
  #stepcard .out .ln { white-space: pre-wrap; overflow-wrap: anywhere; }
  #stepcard .out .cmd { color: var(--muted); }
  #stepcard .out .ready { color: var(--ok); font-weight: 700; }
  #stepcard .out .bad { color: var(--denytext); font-weight: 700; }
  #stepcard .out .wait { color: var(--accent); font-style: italic; }
</style>
</head>
<body>
<header id="status" aria-label="Controls"><span class="k">Reading controls</span></header>
<nav id="moments" aria-label="Moments"><span class="lbl">MOMENT</span><span class="pills"></span><span class="banner hidden" aria-live="polite"></span><span class="runs" aria-label="Steps for this moment"></span></nav>
<div id="fallbacks" class="hidden" aria-label="Fallback steps"></div>
<main>
  <section class="pane" id="pane-maya" data-pane="maya">
    <h2><span class="name">MAYA PATEL</span><span class="role">Member Services</span><span class="busy hidden">agent working</span></h2>
    <div class="chat" aria-live="polite"></div>
    <div class="actions">
      <select class="steps" aria-label="Step prompt"></select>
      <a class="btn primary connect hidden" target="_blank" rel="noopener noreferrer">Connect partner account</a>
      <button class="req-approval" disabled>Request approval</button>
      <button class="disconnect">Disconnect partner</button>
      <button class="direct">Direct call (M5)</button>
      <button class="direct-m5b">Direct call (M5b)</button>
      <button class="new">New conversation</button>
    </div>
    <div class="flash"></div>
    <form class="ask"><textarea aria-label="Prompt for Maya" placeholder="Pick a step or type; Enter sends"></textarea></form>
  </section>
  <section class="pane" id="pane-right" data-pane="right">
    <h2><span class="name">LEO MARTINEZ</span><span class="role">Loan Officer</span><span class="busy hidden">agent working</span></h2>
    <div class="chat" aria-live="polite"></div>
    <div class="card hidden">
      <div class="title">Approval request from Maya Patel</div>
      <div class="kv"><span>Member</span><b class="a-member"></b></div>
      <div class="kv"><span>To account</span><b class="a-dest"></b></div>
      <div class="kv"><span>Amount</span><b class="a-amount"></b></div>
      <div class="kv"><span>Requested at</span><b class="a-time"></b></div>
      <div class="row"><button class="primary approve">Approve as Dana</button><button class="cancel">Cancel</button></div>
      <div class="msgline"></div>
    </div>
    <div class="actions">
      <select class="steps" aria-label="Step prompt"></select>
      <button class="new">New conversation</button>
    </div>
    <div class="flash"></div>
    <form class="ask"><textarea aria-label="Prompt for Leo" placeholder="Pick a step or type; Enter sends"></textarea></form>
  </section>
</main>
<footer id="feed">
  <div id="stepcard" class="hidden" aria-live="polite">
    <div class="hd"><span class="kind"></span><span class="title"></span><span class="desc"></span><span class="state"></span><button class="x stop hidden" type="button">Stop</button><button class="x close" type="button">Close</button></div>
    <div class="body"><div class="code"></div><div class="out"><div class="scroll"></div></div></div>
  </div>
  <table>
    <colgroup><col class="w-t"><col class="w-p"><col class="w-tool"><col class="w-d"><col class="w-c"><col></colgroup>
    <thead><tr><th>Time (ET)</th><th>Persona</th><th>Tool</th><th>Decision</th><th>Control</th><th>Reason</th></tr></thead>
    <tbody id="feedrows"></tbody>
  </table>
</footer>
<script nonce="__NONCE__">
"use strict";
const $ = (sel, root) => (root || document).querySelector(sel);
const view = { maya: { turns: new Map() }, right: { turns: new Map() } };
const feedRows = new Map();
const DEC = { ALLOWED: "ok", DENIED: "deny", REDACTED: "redact", SUPPRESSED: "supp", THROTTLED: "throt", CONSENT_REQUIRED: "consent",
              STALE: "other", ERROR: "deny", READY: "ok", DISCONNECTED: "consent", STEP: "other" };
let prompts = {};

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function clean(t) { return (t || "").replace(/\*\*(.+?)\*\*/g, "$1").replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1$2").replace(/^#{1,6}\s*/gm, ""); }
function pane(key) { return document.getElementById("pane-" + key); }
function dec(d) { return el("span", "dec " + (DEC[d] || "other"), d); }

async function api(path, body) {
  const opts = { method: body === undefined ? "GET" : "POST", credentials: "same-origin", headers: {} };
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  if (r.status === 401) { location.reload(); return null; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

function flash(key, text) { const f = $(".flash", pane(key)); f.textContent = text || ""; if (text) setTimeout(() => { f.textContent = ""; }, 8000); }

function item(k, v, cls) { const s = el("span", "it"); s.append(el("span", "k", k), el("span", "v" + (cls ? " " + cls : ""), v)); return s; }
function onoff(v) { const u = String(v || "?").toUpperCase(); return [u, (u === "ON" || u === "ACTIVE" || u === "ACT_ON_BEHALF") ? "on" : "off"]; }
function rate(r) { if (r === undefined || r === null) return "?"; return r >= 10000 ? "10,000/s" : Math.round(r) + "/s"; }
/* What changed: an item whose value differs from the previous ok status gets the CHANGED mark (none on the first status
   after a page load). The mark stays until the next send in either pane, a New conversation, or 120 s. */
const MARK_MS = 120000;
let lastStatus = null, lastOk = null;
const marked = new Map();  /* status item name -> time (ms) its mark ends */
function renderStatus(st) {
  const s = $("#status");
  lastStatus = st;
  s.textContent = "";
  if (!st || st.state !== "ok") { s.append(item("Controls", st && st.state === "unavailable" ? "unavailable (" + st.error + ")" : "reading", "off")); return; }
  const p = st.policies || {};
  const items = [["Deputy", onoff(st.deputy)], ["Masking", onoff(st.masking)], ["Notes guardrail", onoff(p.SuppressSsnInNotes)],
                 ["Destination rule", onoff(p.DestinationSeenInSession)], ["Prompt guard", onoff(st.prompt_guard)],
                 ["Approval rule", onoff(p.ApprovalOver2500)], ["Limit", [rate(st.rate_per_second), ""]]];
  const now = Date.now(), values = {};
  for (const [k, [t]] of items) {
    values[k] = t;
    if (lastOk && lastOk[k] !== undefined && lastOk[k] !== t) { marked.set(k, now + MARK_MS); setTimeout(() => renderStatus(lastStatus), MARK_MS + 50); }
  }
  lastOk = values;
  for (const [k, [t, c]] of items) {
    const it = item(k, t, c);
    if ((marked.get(k) || 0) > now) { it.classList.add("chg"); it.append(el("span", "tag", "CHANGED")); } else marked.delete(k);
    s.append(it);
  }
  s.title = "controls read at " + st.read_at;
}
function clearMarks() { if (marked.size) { marked.clear(); if (lastStatus) renderStatus(lastStatus); } }

/* Moment tracker, in talk order (console/core.py STAGES; on stage 5b is the prompt guard, internal M5c, and 5c human
   approval, internal M5b). An older console keeps no moment: a click then still moves the tracker on this page. */
const STAGES = [["1", "1 Front door"], ["2", "2 Per-person tokens"], ["3", "3 Act on behalf"], ["4", "4 Masking"],
                ["5a", "5a Sequence rule"], ["5b", "5b Prompt guard"], ["5c", "5c Approval"], ["6", "6 Rate limit"]];
function buildTracker() {
  const box = $("#moments .pills");
  STAGES.forEach(([id, name]) => {
    const b = el("button", "mp todo"); b.type = "button"; b.dataset.stage = id; b.title = name;
    b.append(el("span", "ck", "\u2713"), el("span", "id", id), el("span", "nm", name.slice(id.length)));
    box.append(b);
  });
  box.addEventListener("click", (e) => { const b = e.target.closest("button.mp"); if (b) pickMoment(b.dataset.stage); });
}
function renderMoment(m) {
  const cur = m && m.current ? String(m.current) : null, idx = STAGES.findIndex(([id]) => id === cur);
  document.querySelectorAll("#moments button.mp").forEach((b, i) => { b.className = "mp " + (i === idx ? "cur" : idx >= 0 && i < idx ? "done" : "todo"); });
  $("#moments").title = cur && m.at ? "moment " + cur + " (" + (m.source || "") + ", " + m.at + " ET)" : "";
  steps.stage = cur || "";
  renderRuns();
}
async function pickMoment(stage) {
  renderMoment({ current: stage, source: "click" });
  try { await api("/api/moment", { stage, source: "click" }); } catch (e) { /* an older console has no /api/moment: the page keeps it */ }
}

/* Script banner at the right end of the tracker: Running (accent), Done (green, hides after 20 s), Failed (red, stays). */
const BANNER = { running: "Running", done: "Done", failed: "Failed" };
let bannerTimer = null;
function renderBanner(b) {
  const box = $("#moments .banner");
  clearTimeout(bannerTimer);
  if (!b || !b.text || !BANNER[b.state]) { box.className = "banner hidden"; box.textContent = ""; return; }
  box.className = "banner " + b.state;
  box.textContent = BANNER[b.state] + ": " + b.text;
  box.title = box.textContent + (b.at ? " (" + b.at + " ET)" : "");
  if (b.state === "done") bannerTimer = setTimeout(() => { box.className = "banner hidden"; }, Math.max(0, 20000 - 1000 * (Number(b.age_s) || 0)));
}

function addChip(container, c) {
  const chip = el("span", "chip"); if (c.row) chip.dataset.row = c.row;
  chip.append(el("span", "tool", c.tool + " "), dec(c.decision)); container.append(chip);
}
function syncChips(row) {  /* a trail row can upgrade a decision after the chip was drawn (ALLOWED to REDACTED) */
  document.querySelectorAll(".chip").forEach((chip) => { if (chip.dataset.row === row.id) chip.replaceChild(dec(row.decision), chip.lastChild); });
}
function scroll(key) { const c = $(".chat", pane(key)); c.scrollTop = c.scrollHeight; }
function addTurn(key, t) {
  const chat = $(".chat", pane(key));
  const box = el("div", "turn"); box.dataset.id = t.id;
  const chips = el("div", "chips"), notes = el("div", "notes"), agent = el("div", "msg agent", clean(t.text));
  box.append(el("div", "msg user", t.prompt), chips, notes, agent);
  (t.chips || []).forEach((c) => addChip(chips, c));
  (t.notes || []).forEach((n) => notes.append(el("div", "note", n)));
  chat.append(box);
  view[key].turns.set(t.id, { chips, notes, agent, raw: t.text || "" });
  while (chat.children.length > 3) { const first = chat.firstElementChild; view[key].turns.delete(first.dataset.id); first.remove(); }
  scroll(key);
}
function setBusy(key, busy) { $(".busy", pane(key)).classList.toggle("hidden", !busy); }
function setConsent(key, url) {
  const a = $(".connect", pane(key));
  if (!a) return;
  if (url && url.startsWith("https://")) { a.href = url; a.classList.remove("hidden"); } else { a.removeAttribute("href"); a.classList.add("hidden"); }
}
function setMode(mode, req) {
  const p = pane("right"), approval = mode === "approval";
  $(".card", p).classList.toggle("hidden", !approval);
  [".chat", ".actions", "form.ask"].forEach((s) => $(s, p).classList.toggle("hidden", approval));
  $(".name", p).textContent = approval ? "DANA KIM" : "LEO MARTINEZ";
  $(".role", p).textContent = approval ? "Branch Supervisor" : "Loan Officer";
  if (approval && req) {
    $(".a-member", p).textContent = req.member_id || ""; $(".a-dest", p).textContent = req.destination_ref || "";
    $(".a-amount", p).textContent = req.amount !== undefined && req.amount !== null ? "$" + Number(req.amount).toLocaleString("en-US") : "";
    $(".a-time", p).textContent = req.requested || ""; $(".msgline", p).textContent = "";
  }
}
function renderPane(s, approval) {
  const p = pane(s.pane), chat = $(".chat", p);
  chat.textContent = ""; view[s.pane].turns.clear();
  s.turns.forEach((t) => addTurn(s.pane, t));
  setConsent(s.pane, s.consent_url); setBusy(s.pane, s.busy);
  if (s.pane === "maya") $(".req-approval", p).disabled = !s.approval_candidate;
  if (s.pane === "right") setMode(s.mode, approval);
}

function onPane(ev) {
  const key = ev.pane, v = view[key], t = ev.turn_id ? v.turns.get(ev.turn_id) : null;
  if (ev.type === "turn_start" || ev.type === "snapshot") clearMarks();  /* a send or a New conversation, from any page */
  switch (ev.type) {
    case "turn_start": addTurn(key, ev.turn); setBusy(key, true); break;
    case "text": if (t) { t.raw += ev.text; t.agent.textContent = clean(t.raw); scroll(key); } break;
    case "decision": if (t) { addChip(t.chips, ev); scroll(key); } break;
    case "note": if (t) { if (ev.reset_text) { t.raw = ""; t.agent.textContent = ""; } t.notes.append(el("div", "note", ev.text)); } break;
    case "consent": setConsent(key, ev.url); break;
    case "approval_candidate": $(".req-approval", pane("maya")).disabled = false; break;
    case "turn_end": setBusy(key, false); if (ev.snapshot && key === "maya") $(".req-approval", pane("maya")).disabled = !ev.snapshot.approval_candidate; break;
    case "mode": setMode(ev.mode, ev.approval); break;
    case "snapshot": renderPane(ev.snapshot, null); break;
  }
}

function renderFeed() {
  while (feedRows.size > 60) feedRows.delete(feedRows.keys().next().value);
  const rows = Array.from(feedRows.values()).slice(-6), tb = $("#feedrows");
  tb.textContent = "";
  for (const r of rows) {
    const tr = el("tr"), d = el("td", "d");
    d.append(dec(r.decision));
    tr.append(el("td", "t", r.time), el("td", "p", r.persona), el("td", "tool", r.tool), d, el("td", "c", r.control), el("td", "r", r.reason));
    tr.title = (r.sources || []).join(", ");
    tb.append(tr);
  }
  for (let i = rows.length; i < 6; i++) { const tr = el("tr"); for (let j = 0; j < 6; j++) tr.append(el("td", "", "")); tb.append(tr); }
}
function onFeed(ev) {
  if (ev.type === "row") { feedRows.set(ev.row.id, ev.row); renderFeed(); syncChips(ev.row); }
  else if (ev.type === "status") renderStatus(ev.status);
  else if (ev.type === "moment") renderMoment(ev.moment);
  else if (ev.type === "banner") renderBanner(ev.banner);
  else if (ev.type === "card") setCard(ev.card);
  else if (ev.type === "card_lines") addCardLines(ev);
  else if (ev.type === "step_runs") { steps.runs = ev.step_runs || {}; renderRuns(); }
}

async function loadSnapshot() {
  const s = await api("/api/snapshot");
  if (!s) return;
  renderPane(s.panes.maya, null); renderPane(s.panes.right, s.approval);
  feedRows.clear(); (s.feed || []).forEach((r) => feedRows.set(r.id, r)); renderFeed();
  renderStatus(s.status);
  if ("moment" in s) renderMoment(s.moment);  /* an older console sends neither field */
  if ("banner" in s) renderBanner(s.banner);
  if ("step_runs" in s) steps.runs = s.step_runs || {};  /* a console from before the step card sends neither */
  setCard(s.card || null);
}

function stream(path, handler, onopen) {
  const es = new EventSource(path);
  es.onmessage = (m) => { try { handler(JSON.parse(m.data)); } catch (e) { /* ignore a malformed event */ } };
  if (onopen) es.onopen = onopen;
  return es;
}

async function send(key) {
  const ta = $("textarea", pane(key)), prompt = ta.value.trim();
  if (!prompt) return;
  /* The chip's step code goes with it only while the box still holds the selected chip's prompt (free text sends none). */
  const x = (prompts[key] || [])[Number($(".steps", pane(key)).value)];
  const body = x && x.step && String(x.prompt).trim() === prompt ? { prompt, step: x.step } : { prompt };
  try { await api("/api/panes/" + key + "/send", body); ta.value = ""; clearMarks(); } catch (e) { flash(key, e.message); }
}

function wire(key) {
  const p = pane(key), ta = $("textarea", p), sel = $(".steps", p);
  sel.append(el("option", "", "Step prompt..."));
  (prompts[key] || []).forEach((x, i) => { const o = el("option", "", x.label); o.value = String(i); sel.append(o); });
  sel.addEventListener("change", () => { const x = (prompts[key] || [])[Number(sel.value)]; if (x) { ta.value = x.prompt; ta.focus(); } });
  ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(key); } });
  $("form.ask", p).addEventListener("submit", (e) => { e.preventDefault(); send(key); });
  $(".new", p).addEventListener("click", async () => { try { await api("/api/panes/" + key + "/new", {}); clearMarks(); } catch (e) { flash(key, e.message); } });
}

async function main() {
  buildTracker();
  prompts = (await api("/api/prompts")) || {};
  wire("maya"); wire("right");
  const mp = pane("maya"), rp = pane("right");
  $(".disconnect", mp).addEventListener("click", async () => {
    try { const r = await api("/api/panes/maya/disconnect", {}); flash("maya", r.consent_repeats ? "Disconnected: consent will repeat." : "Disconnect sent."); }
    catch (e) { flash("maya", e.message); }
  });
  $(".direct", mp).addEventListener("click", async () => { try { await api("/api/panes/maya/direct", { moment: "m5" }); } catch (e) { flash("maya", e.message); } });
  $(".direct-m5b", mp).addEventListener("click", async () => { try { await api("/api/panes/maya/direct", { moment: "m5b" }); } catch (e) { flash("maya", e.message); } });
  $(".req-approval", mp).addEventListener("click", async () => { try { await api("/api/approval/request", {}); } catch (e) { flash("maya", e.message); } });
  $(".approve", rp).addEventListener("click", async () => {
    $(".msgline", rp).textContent = "Signing Dana in and recording the approval...";
    try { const r = await api("/api/approval/approve", {}); $(".msgline", rp).textContent = r.approved ? "Approved." : "Not approved: " + (r.reason || ""); }
    catch (e) { $(".msgline", rp).textContent = e.message; }
  });
  $(".cancel", rp).addEventListener("click", async () => { try { await api("/api/approval/cancel", {}); } catch (e) { flash("right", e.message); } });
  await loadSteps();
  wireSteps();
  await loadSnapshot();
  stream("/api/panes/maya/stream", onPane);
  stream("/api/panes/right/stream", onPane);
  let opened = false;
  stream("/api/feed/stream", onFeed, () => { if (opened) loadSnapshot(); opened = true; });
  setInterval(tick, 1000);
  addEventListener("resize", fitTracker);
}

/* ---- Step card and Run buttons. Every registry and output string goes in with textContent or text
   nodes; the code coloring builds spans from text. A console from before the step card answers /api/steps with 404:
   then no Run buttons and no card, and the script banner works as before. ---- */
const steps = { cards: null, byId: new Map(), errors: [], runs: {}, stage: "", card: null, cardAt: 0, pending: false };
const KIND = { api: "api", switch: "switch", "stand-in": "stand" };

async function loadSteps() {
  try {
    const r = await api("/api/steps");
    if (!r) return;
    steps.cards = r.cards || []; steps.errors = r.errors || [];
    steps.byId = new Map(steps.cards.map((c) => [c.id, c]));
  } catch (e) { steps.cards = null; }  /* HTTP 404: an older console */
}

function cardRunning() { return !!(steps.card && steps.card.state === "running"); }
function anyRunning() { return steps.pending || cardRunning() || Object.values(steps.runs).some((r) => r.state === "running"); }
function elapsed() { const c = steps.card; return c ? Math.max(0, Math.round((Number(c.elapsed_s) || 0) + (c.state === "running" ? (Date.now() - steps.cardAt) / 1000 : 0))) : 0; }
function buttonText(c) { return c.button + (c.clip ? " (clip " + c.clip + ")" : ""); }

function runState(c, next) {
  const r = steps.runs[c.id];
  if (cardRunning() && steps.card.id === c.id) return "running";
  if (r && (r.state === "done" || r.state === "failed")) return r.state;
  return c === next ? "next" : "todo";
}

function renderRuns() {
  const box = $("#moments .runs"), nav = $("#moments");
  if (!box) return;
  box.textContent = "";
  const shown = (steps.cards || []).filter((c) => c.show_in === steps.stage);
  const main = shown.filter((c) => !c.fallback), fb = shown.filter((c) => c.fallback);
  nav.classList.toggle("has-runs", shown.length > 0);
  if (!shown.length) { $("#fallbacks").classList.add("hidden"); nav.classList.remove("tight"); return; }
  const next = main.find((c) => !(steps.runs[c.id] && steps.runs[c.id].state === "done"));
  const busy = anyRunning();
  for (const c of main) {
    const st = runState(c, next), b = el("button", "run " + (st === "next" ? "" : st));
    b.type = "button"; b.dataset.id = c.id; b.disabled = busy; b.title = c.title;
    b.textContent = st === "done" ? "\u2713 " + buttonText(c) : st === "running" ? "Running: " + buttonText(c) + " \u00b7 " + elapsed() + " s"
      : st === "failed" ? "\u2717 " + buttonText(c) : "\u25b6 " + buttonText(c);
    box.append(b);
  }
  if (fb.length) {
    const b = el("button", "run todo fb", "Fallbacks \u25be"); b.type = "button"; b.disabled = busy; box.append(b);
    const list = $("#fallbacks"); list.textContent = "";
    for (const c of fb) { const x = el("button", "", "\u25b6 " + buttonText(c)); x.type = "button"; x.dataset.id = c.id; x.title = c.title; x.disabled = busy; list.append(x); }
  } else $("#fallbacks").classList.add("hidden");
  fitTracker();
}
function fitTracker() {
  const nav = $("#moments");
  nav.classList.remove("tight");
  if (nav.classList.contains("has-runs") && nav.scrollWidth > nav.clientWidth + 1) nav.classList.add("tight");
}

async function runStep(id) {
  $("#fallbacks").classList.add("hidden");
  if (anyRunning()) return;
  steps.pending = true; renderRuns();
  try { await api("/api/steps/" + encodeURIComponent(id) + "/run", {}); } catch (e) { flash("maya", "Run: " + e.message); }
  steps.pending = false; renderRuns();
}

function wireSteps() {
  $("#moments .runs").addEventListener("click", (e) => {
    const b = e.target.closest("button.run");
    if (!b || b.disabled) return;
    if (b.classList.contains("fb")) {
      const list = $("#fallbacks"), r = b.getBoundingClientRect();
      list.style.top = Math.round(r.bottom + 4) + "px"; list.style.right = Math.round(innerWidth - r.right) + "px";
      list.classList.toggle("hidden"); return;
    }
    runStep(b.dataset.id);
  });
  $("#fallbacks").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b && !b.disabled) runStep(b.dataset.id); });
  document.addEventListener("click", (e) => { if (!e.target.closest("#fallbacks") && !e.target.closest("button.fb")) $("#fallbacks").classList.add("hidden"); });
  $("#stepcard .close").addEventListener("click", async () => { try { await api("/api/card/close", {}); } catch (e) { setCard(null); } });
  $("#stepcard .stop").addEventListener("click", async () => { try { await api("/api/steps/stop", {}); } catch (e) { flash("maya", "Stop: " + e.message); } });
}

const CODE_RE = /(f?"[^"]*"|f?'[^']*')|(#.*$|\/\/.*$)|\b(\d+(?:\.\d+)?)\b|\b(if|else|elif|while|for|in|not|and|or|def|return|break|None|True|False|import|from|with|as|try|except|raise|lambda|permit|forbid|when|unless)\b/g;
function hlLine(text) {
  const frag = document.createDocumentFragment();
  let last = 0, m;
  CODE_RE.lastIndex = 0;
  while ((m = CODE_RE.exec(text))) {
    if (m.index > last) frag.append(document.createTextNode(text.slice(last, m.index)));
    frag.append(el("span", m[1] ? "str" : m[2] ? "com" : m[3] ? "num" : "kw", m[0]));
    last = m.index + m[0].length;
    if (!m[0].length) CODE_RE.lastIndex++;
  }
  if (last < text.length) frag.append(document.createTextNode(text.slice(last)));
  return frag;
}
function outClass(t) { return /^READY\b/.test(t) ? "ready" : /^(NOT READY|Traceback|[A-Za-z]*Error\b)/.test(t) ? "bad" : /^Waiting\b/.test(t) ? "wait" : ""; }
function outLine(t) { return el("div", "ln" + (outClass(t) ? " " + outClass(t) : ""), t); }

function stateText(c) {
  const s = Number(c.seconds);
  if (c.state === "running") return ["running", "Running \u00b7 " + elapsed() + " s"];
  if (c.state === "done") return ["done", "Done in " + s.toFixed(1) + " s"];
  if (c.state === "stopped") return ["stopped", "Stopped after " + s.toFixed(1) + " s"];
  return ["failed", "Failed (exit " + c.exit_code + ") after " + s.toFixed(1) + " s"];
}

function keepTurnsInView() { requestAnimationFrame(() => { scroll("maya"); scroll("right"); }); }

function setCard(card) {
  const box = $("#stepcard"), wasOpen = !box.classList.contains("hidden");
  steps.card = card; steps.cardAt = Date.now();
  const spec = card && steps.byId.get(card.id);
  if (!card || card.dismissed || !spec || !steps.cards) {
    box.classList.add("hidden"); $("#feed").classList.remove("card-open");
    if (wasOpen) keepTurnsInView();
    renderRuns(); return;
  }
  const kind = $(".kind", box); kind.className = "kind " + (KIND[spec.kind] || "api"); kind.textContent = spec.label;
  $(".title", box).textContent = spec.title; $(".desc", box).textContent = spec.desc; $(".desc", box).title = spec.desc;
  box.classList.toggle("wide", !!spec.wide_output);
  const code = $(".code", box); code.textContent = "";
  spec.excerpts.forEach((x, i) => {
    if (i) code.append(el("div", "gap"));
    code.append(el("div", "src", x.label));
    x.lines.forEach((t, j) => { const d = el("div", "ln" + (j === x.key ? " key" : "")); d.append(hlLine(t)); code.append(d); });
  });
  const out = $(".out .scroll", box); out.textContent = "";
  out.append(el("div", "src", "OUTPUT"), el("div", "ln cmd", "$ " + spec.command));
  (card.lines || []).forEach((t) => out.append(outLine(t)));
  renderCardState();
  box.classList.remove("hidden"); $("#feed").classList.add("card-open");
  out.scrollTop = out.scrollHeight;
  if (!wasOpen) keepTurnsInView();
  renderRuns();
}

function renderCardState() {
  const c = steps.card, box = $("#stepcard");
  if (!c) return;
  const [cls, text] = stateText(c), st = $(".state", box);
  st.className = "state " + cls; st.textContent = text;
  $(".stop", box).classList.toggle("hidden", !(c.state === "running" && c.source === "console"));
}

function addCardLines(ev) {
  const c = steps.card;
  if (!c || c.run_id !== ev.run_id || !Array.isArray(ev.lines)) return;
  c.lines = (c.lines || []).concat(ev.lines).slice(-300);
  if ($("#stepcard").classList.contains("hidden")) return;
  const out = $("#stepcard .out .scroll");
  ev.lines.forEach((t) => out.append(outLine(String(t))));
  while (out.children.length > 302) out.children[2].remove();  /* OUTPUT and the command line stay */
  out.scrollTop = out.scrollHeight;
}

function tick() {
  if (!cardRunning()) return;
  renderCardState();
  const b = $("#moments button.run.running");
  if (b) { const c = steps.byId.get(b.dataset.id); if (c) { b.textContent = "Running: " + buttonText(c) + " \u00b7 " + elapsed() + " s"; fitTracker(); } }
}
main();
</script>
</body>
</html>
